name: Gerar Champions 3D estatico para dexH!P

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'front/**'
      - 'scripts/build-static-sprites.py'
      - '.github/workflows/generate-champions-static.yml'

permissions:
  contents: write

concurrency:
  group: champions-3d-static
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install 'pillow>=11,<13'
      - name: Extrair quadros e otimizar sprites estáticos
        run: python scripts/build-static-sprites.py
      - name: Publicar front-static sem alterar os sprites animados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "H!P Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front-static/
          if git diff --cached --quiet; then
            echo "Todos os sprites estáticos já estão atualizados."
            exit 0
          fi
          git commit -m "Atualizar Champions 3D estáticos da dexH!P"
          git push
